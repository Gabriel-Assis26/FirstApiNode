<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>First API</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='/css/editStyle.css'>
</head>
<body>
    <form id="formProduct">
        <h1 id="titulo">Editar Produto</h1>
        <div>
            <label for="descricao">Descricao</label>
            <input
            type="text"
            id="descricao"
            name="descricao"
            placeholder="descricao"
            required
            >
        </div>
        <div>
            <label for="categoria">Categoria</label>
            <input
            type="text"
            id="categoria"
            name="categoria"
            placeholder="categoria"
            required
            >
        </div>
        <div>
            <label for="preco">Preco</label>
            <input
            type="number"
            step="0.01"
            id="preco"
            name="preco"
            placeholder="10"
            required
            >
        </div>
        <div>
            <label for="estoque">Estoque</label>
            <input
            type="number"
            id="estoque"
            name="estoque"
            placeholder="10"
            required
            >
        </div>
        <button type="submit" id="btnSubmit">Salvar</button>
    </form>
</body>
<script src='/js/editProduct.js'></script>
</html>
